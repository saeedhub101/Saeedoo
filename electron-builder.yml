appId: com.saeed.ai
productName: Saeed
copyright: ""
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - out/renderer/characters/Saeed.glb
  - resources/**/*
  - package.json
asar: true
asarUnpack:
  - resources/models/**
  - node_modules/@xenova/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Saeed-Setup.${ext}
portable:
  artifactName: Saeed-Portable.${ext}
publish:
  provider: github
  owner: saeedhub101
  repo: Saeedoo
  releaseType: release
